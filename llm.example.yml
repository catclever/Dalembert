# llm.example.yml - Example model profile configuration for Dalembert
# Copy to llm.yml or pass API keys via environment variables
#
# Multi-Provider & Model Decoupling Usage (方案 B):
# 1. CLI Usage:
#    - Specify Provider: bin/dalembert -p deepseek -j "..."
#    - Composite syntax: bin/dalembert -p deepseek/deepseek-reasoner -j "..."
#    - Explicit model:   bin/dalembert -p deepseek -m deepseek-reasoner -j "..."
#
# 2. WebSocket / EnginEdge Usage:
#    - enginedge run --profile deepseek/deepseek-reasoner "..."
#    - Or in JSON payload: { "llm_profile": "deepseek", "model": "deepseek-reasoner" }

default:
  format: "openai"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  api_key: "ENV['DEEPSEEK_API_KEY']"
  max_tokens: 8192
  timeout: 120

deepseek:
  format: "openai"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  api_key: "ENV['DEEPSEEK_API_KEY']"
  max_tokens: 8192
  timeout: 120

kimi:
  format: "openai"
  base_url: "https://api.moonshot.cn/v1"
  model: "kimi-k2.6"
  api_key: "ENV['KIMI_API_KEY']"
  max_tokens: 8192
  timeout: 120

openai:
  format: "openai"
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o"
  api_key: "ENV['OPENAI_API_KEY']"
  max_tokens: 8192
  timeout: 120
